name: Release to NuGet

on:
  release:
    types: [published]
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6 
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build FplClient -c Release
    - name: Test
      run: dotnet test -c Release --no-build --filter Category!=Integration
    - name: Pack Models nugets
      run: dotnet pack FplClientModels -c Release --no-build --output models
    - name: Push FplClientModels to NuGet
      run: dotnet nuget push "models/*.nupkg" --api-key ${{secrets.NUGET_API_KEY_FPLCLIENTMODELS}} --source https://api.nuget.org/v3/index.json
    - name: Pack Client nugets
      run: dotnet pack FplClient -c Release --no-build --output client
    - name: Push FplClient to NuGet
      run: dotnet nuget push "client/*.nupkg" --api-key ${{secrets.NUGET_API_KEY_FPLCLIENT}} --source https://api.nuget.org/v3/index.json
