name: Release to NuGet

on:
  release:
    types: [published]
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build
      run: dotnet build FplClient -c Release
    - name: Test
      run: dotnet test -c Release --no-build
    - name: Pack nugets
      run: dotnet pack FplClientModels -c Release --no-build --output .
    - name: Push FplClientModels to NuGet
      run: dotnet nuget push "*.nupkg" --api-key ${{secrets.NUGET_API_KEY_FPLCLIENTMODELS}} --source https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Pack nugets
      run: dotnet pack FplClient -IncludeReferencedProjects -c Release --no-build --output .
    - name: Push FplClient to NuGet
      run: dotnet nuget push "*.nupkg" --api-key ${{secrets.NUGET_API_KEY_FPLCLIENT}} --source https://api.nuget.org/v3/index.json --skip-duplicate
